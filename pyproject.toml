[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gestor-peliculas"
version = "1.0.0"
description = "Catalogo, organizacion y reproduccion de una coleccion local de peliculas"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.0",
    "Flask-WTF>=1.2",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "Pillow>=10.0",
    "Send2Trash>=1.8",
    "waitress>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
gestor-peliculas = "gestor_peliculas.cli.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gestor_peliculas = [
    "almacenamiento/*.sql",
    "web/templates/*.html",
    "web/templates/**/*.html",
    "web/static/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
